server:
  port: 8083

spring:
  application:
    name: payment-service
  profiles:
    active: local

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

  kafka:
    topic:
      payment:
        name: ${KAFKA_PAYMENT_TOPIC:payment-events}
        partitions: 3
        replicas: 3
        retention-ms: 86400000

application:
  integration:
    external-payment-service:
      url: ${EXTERNAL_SERVICE_URL:https://api.random.org}
      api-key: ${EXTERNAL_SERVICE_KEY:02ded9b1-b168-4381-b8f2-ebd03aa62da2}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %clr(%5p) %clr(${PID:- }){magenta} --- [%15.15t] %clr(%-40.40logger{36}){cyan} [%X{traceId:-none}] : %m%n"
  level:
    level:
      root: INFO
      org.apache.kafka.clients.NetworkClient: WARN