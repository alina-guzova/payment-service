spring:
  data:
    mongodb:
      uri: mongodb://${DB_USERNAME:mongo}:${DB_PASSWORD:password}@${DB_HOST:localhost}:${DB_PORT:27017}/${DB_NAME:payment_service_db}?authSource=admin&replicaSet=rs0
  liquibase:
    url: mongodb://${DB_USERNAME:mongo}:${DB_PASSWORD:password}@${DB_HOST:localhost}:${DB_PORT:27017}/${DB_NAME:payment_service_db}?authSource=admin&replicaSet=rs0
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9094,localhost:9095}

application:
  integration:
    order-service:
      url: ${ORDER_SERVICE_URL:http://localhost:8082}