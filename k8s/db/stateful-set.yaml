apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: payment-service-db
  namespace: dev
spec:
  serviceName: payment-service-db-service
  replicas: 1
  selector:
    matchLabels:
      app: payment-service-db
  template:
    metadata:
      labels:
        app: payment-service-db
    spec:
      containers:
        - name: payment-service-db
          image: mongo:7.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: payment-db-port
              containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: payment-service-db-secret
                  key: PAYMENT_DB_USER
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: payment-service-db-secret
                  key: PAYMENT_DB_PASSWORD
          envFrom:
            - configMapRef:
                name: payment-service-db-config
          command:
            - sh
            - -c
            - |
              mongod --replSet rs0 --bind_ip_all &
              
              TARGET_HOST="payment-service-db-0.payment-service-db-service.dev.svc.cluster.local:27017"
              
              echo "Waiting for MongoDB..."
              until mongosh --host $TARGET_HOST --eval "db.adminCommand('ping')" > /dev/null 2>&1; do
                sleep 2
              done
              
              echo "Checking Replica Set..."
              mongosh --host $TARGET_HOST --eval "
                try {
                  var status = rs.status();
                  if (status.ok === 1) {
                    print('Replica set is already initialized.');
                  }
                } catch (e) {
                  print('Initializing Replica Set rs0...');
                  rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: '$TARGET_HOST' }] });
              
                  while (!db.isMaster().ismaster) {
                    sleep(1000);
                  }
              
                  const adminDB = db.getSiblingDB('admin');
                  adminDB.createUser({
                    user: process.env.MONGO_INITDB_ROOT_USERNAME,
                    pwd: process.env.MONGO_INITDB_ROOT_PASSWORD,
                    roles: [{ role: 'root', db: 'admin' }]
                  });
                  print('Replica set initialized and root user created.');
                }
              "
              
              wait
          readinessProbe:
            exec:
              command:
                - mongosh
                - "-u"
                - "$(MONGO_INITDB_ROOT_USERNAME)"
                - "-p"
                - "$(MONGO_INITDB_ROOT_PASSWORD)"
                - "--authenticationDatabase"
                - "admin"
                - "--eval"
                - "db.adminCommand('ping')"
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - mongosh
                - "-u"
                - "$(MONGO_INITDB_ROOT_USERNAME)"
                - "-p"
                - "$(MONGO_INITDB_ROOT_PASSWORD)"
                - "--authenticationDatabase"
                - "admin"
                - "--eval"
                - "db.adminCommand('ping')"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5

  volumeClaimTemplates:
    - metadata:
        name: mongo-payment
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 1Gi